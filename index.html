<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Arshman Anil">
    <title>PyCJ - Professional IDE</title>
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
</head>
<body class="dark-theme">
    <div class="app-container">
        <header class="top-navbar">
            <div class="header-left">
                <div class="branding">
                    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));">
                        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#2f81f7"/>
                        <path d="M2 17L12 22L22 17" stroke="#2f81f7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M2 12L12 17L22 12" stroke="#61afef" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <h1>PyCJ <span class="version-badge">v1.0</span></h1>
                </div>
            </div>
            
            <div class="header-center">
                <div class="responsive-tabs">
                    <button id="tab-code" class="tab-link active">Editor</button>
                    <button id="tab-console" class="tab-link">Terminal</button>
                </div>
            </div>
            
            <div class="header-right">
                <div class="dropdown-container">
                    <button id="menu-toggle" class="menu-hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                    <div id="main-dropdown" class="dropdown-menu">
                        <div class="dropdown-item-toggle">
                            <span>💾 Autosave</span>
                            <label class="switch-ui">
                                <input type="checkbox" id="autosave-toggle" checked>
                                <span class="switch-slider"></span>
                            </label>
                        </div>
                        <div class="dropdown-divider"></div>
                        <button id="share-code-btn" class="dropdown-item">🔗 Share Code</button>
                        <button id="clear-terminal-btn" class="dropdown-item">🧹 Clear Terminal</button>
                        <div class="dropdown-divider"></div>
                        <button id="theme-toggle" class="dropdown-item">🌓 Toggle Theme</button>
                        <button id="upload-btn" class="dropdown-item">📂 Upload File</button>
                        <button id="download-btn" class="dropdown-item">💾 Download File</button>
                    </div>
                </div>
                <input type="file" id="file-input" accept=".txt,.pycj" style="display: none;">
                
                <button id="run-btn" class="btn btn-primary">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"></path></svg>
                    Run
                </button>
            </div>
        </header>

        <main class="workspace-viewport show-editor" id="workspace">
            <section class="panel editor-panel">
                <div class="panel-header">
                    <span class="panel-title">Active Script Editor</span>
                    <span class="shortcut-hint">Ctrl + Enter to Run</span>
                </div>
                <div class="editor-scroll-container">
                    <div class="editor-workarea">
                        <textarea id="code-editor" spellcheck="false" autocomplete="off"></textarea>
                    </div>
                </div>
            </section>

            <section class="panel console-panel" id="console-panel">
                <div class="panel-header">
                    <span class="panel-title">Interactive Terminal</span>
                </div>
                <div id="output" class="console-body">PyCJ v1.0 Terminal Initialized...<br>Waiting for execution.</div>
                
                <div class="console-input-container" id="terminal-input-container" style="display: none;">
                    <span class="console-prompt-text" id="terminal-prompt">&gt;</span>
                    <input type="text" id="terminal-input-field" class="console-input-field" placeholder="Type input and press Enter..." autofocus>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Made By <a href="https://codewitharshman.vercel.app/" target="_blank" rel="noopener noreferrer">Arshman Anil</a></p>
        </footer>
    </div>

    <!-- Custom Share Code Modal -->
    <div id="share-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button id="modal-close-btn" class="modal-close-btn">&times;</button>
            <h3>🔗 Share Code</h3>
            <p>Copy this random link to share your code. It will never repeat!</p>
            <input type="text" id="share-url-input" readonly>
            <button id="modal-copy-btn" class="modal-copy-btn">Copy Link</button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/mode/simple.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/matchbrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/selection/active-line.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
    
    <script src="compiler.js?v=6"></script>
    <script src="script.js?v=6"></script>
</body>
</html>
